---
# Checks for every pull request (and by hand): builds Diana's APK, the same variant the release workflow ships.
name: ci

"on":
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
      - name: Install the NDK app/build.gradle asks for
        # Gradle can download it by itself, but that download failed on the runner ("Error on ZipFile")
        run: |
          ndk=$(sed -n 's/^ *ndkVersion "\(.*\)"/\1/p' app/build.gradle)
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Diana APK
        run: ./gradlew --no-daemon assembleNonRoot_gameDebug
