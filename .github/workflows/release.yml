---
# Diana release on every push to scrollstick (or by hand). Without the signing secrets it ends green without
# publishing anything.
#
# Diana is the "debug" build type: it has its own application id (com.limelight.noirdebug) and name, while the
# "release" build type is Artemis' official id, which forks must not ship. It is built in a job WITHOUT secrets
# (Gradle runs the repo's code); the key only appears in a second job that neither checks out nor runs anything
# from the repo, and that re-signs the APK with it.
#
# Secrets: ANDROID_KEYSTORE_BASE64 (the keystore, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD. To update a Diana already installed with adb, use the keystore that built it (Android
# only updates an app signed with the same key).
name: release

"on":
  push:
    branches: [scrollstick]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/scrollstick'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      code: ${{ steps.version.outputs.code }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v6.4.0
        with:
          cache-provider: basic
      - name: versionCode that also grows on a re-run
        id: version
        # A re-run does not repeat run_number; with run_attempt the versionCode always grows. Starts above 57,
        # the versionCode of the Artemis base, so a release updates a Diana installed by hand.
        run: |
          code=$(( 1000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT ))
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=20.2.6-diana.$code" >> "$GITHUB_OUTPUT"
      - name: Install the NDK app/build.gradle asks for
        # Gradle can download it by itself, but that download failed on the runner ("Error on ZipFile")
        run: |
          ndk=$(sed -n 's/^ *ndkVersion "\(.*\)"/\1/p' app/build.gradle)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
      - name: Diana APK
        env:
          CODE: ${{ steps.version.outputs.code }}
          NAME: ${{ steps.version.outputs.name }}
        run: ./gradlew --no-daemon assembleNonRoot_gameDebug -PversionCode=$CODE -PversionName=$NAME
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: diana-apk
          path: app/build/outputs/apk/nonRoot_game/debug/app-nonRoot_game-arm64-v8a-debug.apk
          retention-days: 1

  sign-publish:
    needs: build
    if: github.ref == 'refs/heads/scrollstick'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CODE: ${{ needs.build.outputs.code }}
      NAME: ${{ needs.build.outputs.name }}
      BT: /usr/local/lib/android/sdk/build-tools/36.0.0
    steps:
      - name: Signing secrets present?
        id: signing
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::notice::no signing secrets: nothing is published"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          else
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: steps.signing.outputs.sign == 'true'
        with:
          name: diana-apk
      - name: Write the keystore (only in $RUNNER_TEMP)
        if: steps.signing.outputs.sign == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/diana.keystore"
      - name: Read the keystore before signing
        if: steps.signing.outputs.sign == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: keytool -list -keystore "$RUNNER_TEMP/diana.keystore" -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null
      - name: Align and sign
        if: steps.signing.outputs.sign == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          "$BT/zipalign" -f -P 16 4 app-nonRoot_game-arm64-v8a-debug.apk aligned.apk
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/diana.keystore" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "Diana-$NAME.apk" aligned.apk
      - name: Verify the signature
        if: steps.signing.outputs.sign == 'true'
        run: '"$BT/apksigner" verify --print-certs "Diana-$NAME.apk"'
      - name: Publish the release
        if: steps.signing.outputs.sign == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v$NAME" "Diana-$NAME.apk" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "Diana $NAME" --generate-notes
      - name: Delete the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/diana.keystore"
